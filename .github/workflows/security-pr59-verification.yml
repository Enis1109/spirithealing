name: Verify security dependency update
on:
  push:
    branches:
      - fix/patch-vulnerabilities-61163c49-1795542674
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve compatible fixes for inspection
        run: |
          npm audit fix --package-lock-only --ignore-scripts --json > "$RUNNER_TEMP/spirit-audit-fix.json" || true
          git diff --numstat -- package.json package-lock.json
          git diff -- package.json package-lock.json | sed -n '1,500p'
      - run: npm ci --no-audit
      - run: npm test
      - name: Report npm audit totals
        if: always()
        run: |
          npm audit --json > "$RUNNER_TEMP/spirit-npm-audit.json" || true
          node -e 'const r = require(process.argv[1]); if (!r.metadata || r.error) throw Error("npm audit unavailable"); console.log(JSON.stringify(r.metadata.vulnerabilities)); console.log(JSON.stringify(Object.entries(r.vulnerabilities).map(([name,v]) => ({name,severity:v.severity,fix:v.fixAvailable}))));' "$RUNNER_TEMP/spirit-npm-audit.json"
