name: Verify final security updates and SMTP
on:
  push:
    branches:
      - fix/patch-vulnerabilities-61163c49-1795542674
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and inspect Nodemailer security update
        run: |
          npm install nodemailer@10.6.1 --save-exact --package-lock-only --ignore-scripts --no-audit
          git diff -- package.json package-lock.json
      - run: npm ci --no-audit
      - name: Test encrypted SMTP for welcome and invoice
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/spirit-smtp-key.pem" -out "$RUNNER_TEMP/spirit-smtp-cert.pem" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' 2>/dev/null
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/spirit-smtp-cert.pem" node --input-type=module - <<'SPIRIT_SMTP'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { once } from "node:events";
          import { createServer } from "node:tls";
          const messages = [];
          const recipients = [];
          const sockets = new Set();
          let authentications = 0;
          const dir = process.env.RUNNER_TEMP;
          const smtp = createServer({
            key: readFileSync(dir + "/spirit-smtp-key.pem"),
            cert: readFileSync(dir + "/spirit-smtp-cert.pem"),
          }, socket => {
            sockets.add(socket);
            socket.on("close", () => sockets.delete(socket));
            socket.on("error", () => {});
            socket.setEncoding("utf8");
            socket.write("220 localhost ESMTP test\r\n");
            let buffer = "", data = null;
            socket.on("data", chunk => {
              buffer += chunk;
              for (let end; (end = buffer.indexOf("\r\n")) >= 0;) {
                const line = buffer.slice(0, end);
                buffer = buffer.slice(end + 2);
                if (data) {
                  if (line === ".") {
                    messages.push(data.join("\r\n").replace(/=\r\n/g, ""));
                    data = null;
                    socket.write("250 Message accepted\r\n");
                  } else {
                    data.push(line);
                  }
                } else if (/^EHLO /i.test(line)) {
                  socket.write("250-localhost\r\n250 AUTH PLAIN\r\n");
                } else if (/^AUTH PLAIN /i.test(line)) {
                  const credential = Buffer.from(line.split(" ")[2], "base64").toString();
                  if (credential === "\0smtp-test\0dummy-no-credential") {
                    authentications++;
                    socket.write("235 Authentication successful\r\n");
                  } else {
                    socket.write("535 Invalid login\r\n");
                  }
                } else if (/^MAIL FROM:/i.test(line)) {
                  socket.write("250 OK\r\n");
                } else if (/^RCPT TO:/i.test(line)) {
                  recipients.push(line);
                  socket.write("250 OK\r\n");
                } else if (line === "DATA") {
                  data = [];
                  socket.write("354 End data with <CRLF>.<CRLF>\r\n");
                } else if (line === "QUIT") {
                  socket.end("221 Bye\r\n");
                } else {
                  socket.write("500 Invalid command\r\n");
                }
              }
            });
          });
          smtp.listen(0, "127.0.0.1");
          await once(smtp, "listening");
          try {
            Object.assign(process.env, {
              SMTP_HOST: "127.0.0.1",
              SMTP_PORT: String(smtp.address().port),
              SMTP_SECURE: "true",
              SMTP_USER: "smtp-test",
              SMTP_PASSWORD: "dummy-no-credential",
              SMTP_FROM: "Spirit Healing Test <sender@example.test>",
              CONTACT_NOTIFICATION_TO: "support@example.test",
            });
            const { sendRaunaechteWelcome } = await import("./server/mailer.js");
            const { deliverRaunaechteWelcomes } = await import("./server/raunaechteWelcome.js");
            const rows = [
              { stripe_id: "cs_live_smoketest", email: "buyer@example.test", invoice_url: null, welcome_attempts: 0 },
              { stripe_id: "in_smoketest", email: "buyer@example.test", invoice_url: "https://invoice.stripe.com/i/smoke", welcome_attempts: 0 },
            ];
            const status = [];
            const db = { async execute(sql, args) {
              if (sql.startsWith("SELECT")) return [rows];
              if (!sql.includes("welcome_attempts = welcome_attempts + 1")) status.push(args);
              return [{ affectedRows: 1 }];
            }};
            await deliverRaunaechteWelcomes(db, sendRaunaechteWelcome);
            assert.deepEqual(status, [["sent", "cs_live_smoketest"], ["sent", "in_smoketest"]]);
            assert.equal(authentications, 2);
            assert.equal(messages.length, 2);
            assert.deepEqual(recipients, ["RCPT TO:<buyer@example.test>", "RCPT TO:<buyer@example.test>"]);
            assert.match(messages[0], /Message-ID: <raunaechte-cs_live_smoketest@spirit-healing\.tr>/i);
            assert.match(messages[0], /23\. Dezember 2026/);
            assert.match(messages[1], /Message-ID: <raunaechte-in_smoketest@spirit-healing\.tr>/i);
            assert.match(messages[1], /https:\/\/invoice\.stripe\.com\/i\/smoke/);
            console.log("Raunaechte welcome and invoice: authenticated TLS SMTP accepted both messages and the receipt link.");
          } finally {
            for (const socket of sockets) socket.destroy();
            await new Promise(resolve => smtp.close(resolve));
          }
          SPIRIT_SMTP
      - run: npm test
      - name: Report npm audit totals
        if: always()
        run: |
          npm audit --json > "$RUNNER_TEMP/spirit-npm-audit.json" || true
          node -e 'const r=require(process.argv[1]); if (!r.metadata || r.error) throw Error("npm audit unavailable"); console.log(JSON.stringify(r.metadata.vulnerabilities)); console.log(JSON.stringify(Object.keys(r.vulnerabilities)));' "$RUNNER_TEMP/spirit-npm-audit.json"
