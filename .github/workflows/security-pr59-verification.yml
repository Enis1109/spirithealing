name: Verify security dependency update
on:
  push:
    branches:
      - fix/patch-vulnerabilities-61163c49-1795542674
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit
      - run: npm test
      - name: Report npm audit totals
        if: always()
        run: |
          npm audit --json > "$RUNNER_TEMP/spirit-npm-audit.json" || true
          node -e 'const r = require(process.argv[1]); if (!r.metadata || r.error) throw Error("npm audit unavailable"); console.log(JSON.stringify(r.metadata.vulnerabilities));' "$RUNNER_TEMP/spirit-npm-audit.json"
